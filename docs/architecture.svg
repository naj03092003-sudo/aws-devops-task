<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="860" fill="#ffffff"/>

  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2631">AWS Architecture - Highly Available 3-Tier App (Terraform + GitHub Actions)</text>

  <!-- ===== Users / DNS ===== -->
  <rect x="20" y="300" width="120" height="70" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="80" y="330" text-anchor="middle" font-size="14" font-weight="bold">Internet</text>
  <text x="80" y="350" text-anchor="middle" font-size="12">Users / Browser</text>

  <rect x="20" y="130" width="120" height="70" rx="8" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="80" y="160" text-anchor="middle" font-size="14" font-weight="bold">Route 53</text>
  <text x="80" y="180" text-anchor="middle" font-size="12">A-alias + ACM DNS</text>

  <!-- ===== Region ===== -->
  <rect x="165" y="55" width="1100" height="790" rx="10" fill="#fafafa" stroke="#455a64" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="180" y="78" font-size="14" font-weight="bold" fill="#455a64">AWS Region  ap-south-1</text>

  <!-- ===== VPC ===== -->
  <rect x="185" y="95" width="790" height="735" rx="10" fill="#f3f9ff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="200" y="118" font-size="14" font-weight="bold" fill="#1565c0">VPC  10.0.0.0/16   (DNS support + hostnames)</text>

  <!-- AZ columns -->
  <rect x="205" y="135" width="370" height="680" rx="8" fill="none" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="215" y="154" font-size="13" font-weight="bold" fill="#546e7a">Availability Zone A  (ap-south-1a)</text>
  <rect x="585" y="135" width="370" height="680" rx="8" fill="none" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="595" y="154" font-size="13" font-weight="bold" fill="#546e7a">Availability Zone B  (ap-south-1b)</text>

  <!-- Public subnets -->
  <rect x="215" y="165" width="350" height="190" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="225" y="182" font-size="12" font-weight="bold" fill="#2e7d32">Public subnet 10.0.0.0/24</text>
  <rect x="595" y="165" width="350" height="190" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="605" y="182" font-size="12" font-weight="bold" fill="#2e7d32">Public subnet 10.0.1.0/24</text>

  <!-- ALB spanning -->
  <rect x="330" y="195" width="500" height="58" rx="8" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="580" y="219" text-anchor="middle" font-size="14" font-weight="bold">Application Load Balancer (internet-facing)</text>
  <text x="580" y="239" text-anchor="middle" font-size="11.5">:443 HTTPS (ACM cert, TLS 1.3/1.2 policy)  |  :80 -> 301 redirect to HTTPS</text>

  <!-- NAT -->
  <rect x="245" y="285" width="130" height="48" rx="6" fill="#ede7f6" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="310" y="306" text-anchor="middle" font-size="12" font-weight="bold">NAT Gateway A</text>
  <text x="310" y="322" text-anchor="middle" font-size="10.5">+ Elastic IP</text>
  <rect x="775" y="285" width="130" height="48" rx="6" fill="#ede7f6" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="840" y="306" text-anchor="middle" font-size="12" font-weight="bold">NAT Gateway B</text>
  <text x="840" y="322" text-anchor="middle" font-size="10.5">+ Elastic IP</text>

  <!-- App subnets -->
  <rect x="215" y="385" width="350" height="200" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="555" y="402" text-anchor="end" font-size="12" font-weight="bold" fill="#ef6c00">Private app subnet 10.0.10.0/24</text>
  <rect x="595" y="385" width="350" height="200" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="605" y="402" font-size="12" font-weight="bold" fill="#ef6c00">Private app subnet 10.0.11.0/24</text>

  <!-- ASG dashed -->
  <rect x="228" y="415" width="704" height="150" rx="8" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="580" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Auto Scaling Group (min 2, max 4)</text>

  <text x="580" y="579" text-anchor="middle" font-size="10" fill="#e65100">CPU target 50% | ELB health checks | rolling refresh</text>
  <rect x="260" y="448" width="270" height="100" rx="6" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>
  <text x="395" y="470" text-anchor="middle" font-size="13" font-weight="bold">EC2 instance (AL2023)</text>
  <text x="395" y="488" text-anchor="middle" font-size="11">Flask + gunicorn :8080 (systemd)</text>
  <text x="395" y="504" text-anchor="middle" font-size="11">IMDSv2 only | encrypted gp3 EBS</text>
  <text x="395" y="520" text-anchor="middle" font-size="11">IAM instance profile | no SSH (SSM)</text>
  <text x="395" y="536" text-anchor="middle" font-size="10.5" fill="#546e7a">from Launch Template</text>

  <rect x="630" y="448" width="270" height="100" rx="6" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>
  <text x="765" y="470" text-anchor="middle" font-size="13" font-weight="bold">EC2 instance (AL2023)</text>
  <text x="765" y="488" text-anchor="middle" font-size="11">Flask + gunicorn :8080 (systemd)</text>
  <text x="765" y="504" text-anchor="middle" font-size="11">IMDSv2 only | encrypted gp3 EBS</text>
  <text x="765" y="520" text-anchor="middle" font-size="11">IAM instance profile | no SSH (SSM)</text>
  <text x="765" y="536" text-anchor="middle" font-size="10.5" fill="#546e7a">from Launch Template</text>

  <!-- DB subnets -->
  <rect x="215" y="620" width="350" height="180" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="225" y="637" font-size="12" font-weight="bold" fill="#ad1457">Private DB subnet 10.0.20.0/24  (no internet route)</text>
  <rect x="595" y="620" width="350" height="180" rx="6" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="605" y="637" font-size="12" font-weight="bold" fill="#ad1457">Private DB subnet 10.0.21.0/24  (no internet route)</text>

  <rect x="260" y="660" width="270" height="110" rx="6" fill="#ffffff" stroke="#ad1457" stroke-width="2"/>
  <text x="395" y="684" text-anchor="middle" font-size="13" font-weight="bold">RDS MySQL 8.0 - Primary</text>
  <text x="395" y="704" text-anchor="middle" font-size="11">Encrypted at rest (KMS CMK)</text>
  <text x="395" y="720" text-anchor="middle" font-size="11">TLS enforced (require_secure_transport)</text>
  <text x="395" y="736" text-anchor="middle" font-size="11">7-day automated backups</text>
  <text x="395" y="752" text-anchor="middle" font-size="11">not publicly accessible</text>

  <rect x="630" y="660" width="270" height="110" rx="6" fill="#ffffff" stroke="#ad1457" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="765" y="684" text-anchor="middle" font-size="13" font-weight="bold">RDS MySQL - Standby (Multi-AZ)</text>
  <text x="765" y="708" text-anchor="middle" font-size="11">Automatic failover target</text>
  <text x="765" y="726" text-anchor="middle" font-size="11">Same subnet group, same SG</text>

  <!-- internal arrows -->
  <!-- ALB to EC2 -->
  <line x1="450" y1="253" x2="395" y2="447" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="253" x2="765" y2="447" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="585" y="320" text-anchor="middle" font-size="11" fill="#37474f">HTTP :8080</text>
  <text x="585" y="334" text-anchor="middle" font-size="10" fill="#546e7a">(SG: ALB -> app only)</text>
  <!-- EC2 to RDS -->
  <line x1="395" y1="548" x2="395" y2="659" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="765" y1="548" x2="765" y2="659" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="403" y="610" font-size="11" fill="#37474f">MySQL :3306 over TLS</text>
  <text x="403" y="624" font-size="10" fill="#546e7a">(SG: app -> db only)</text>
  <!-- sync replication -->
  <line x1="530" y1="715" x2="630" y2="715" stroke="#ad1457" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="580" y="706" text-anchor="middle" font-size="10.5" fill="#ad1457">sync</text>
  <!-- EC2 to NAT (egress) -->
  <line x1="310" y1="448" x2="310" y2="334" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="316" y="375" font-size="10" fill="#546e7a">outbound via NAT</text>
  <line x1="840" y1="448" x2="840" y2="334" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="846" y="375" font-size="10" fill="#546e7a">outbound via NAT</text>

  <!-- IGW -->
  <rect x="800" y="78" width="150" height="26" rx="6" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="875" y="96" text-anchor="middle" font-size="12" font-weight="bold">Internet Gateway</text>
  <line x1="900" y1="104" x2="800" y2="195" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Internet to IGW -->
  <path d="M 140 335 L 160 335 L 160 91 L 799 91" fill="none" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="80" y="388" text-anchor="middle" font-size="11" fill="#37474f">HTTPS 443</text>
  <!-- Route53 -->
  <line x1="80" y1="200" x2="80" y2="299" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="90" y="255" font-size="10.5" fill="#6a1b9a">DNS</text>

  <!-- ===== Right column: regional services ===== -->
  <text x="1070" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">Regional services</text>

  <rect x="995" y="125" width="250" height="78" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1120" y="148" text-anchor="middle" font-size="13" font-weight="bold">S3 - ALB access logs</text>
  <text x="1120" y="166" text-anchor="middle" font-size="11">SSE-S3, private, TLS-only policy</text>
  <text x="1120" y="182" text-anchor="middle" font-size="11">90-day lifecycle expiry</text>

  <rect x="995" y="222" width="250" height="92" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1120" y="245" text-anchor="middle" font-size="13" font-weight="bold">S3 - application bucket</text>
  <text x="1120" y="263" text-anchor="middle" font-size="11">SSE-KMS, versioned, private</text>
  <text x="1120" y="279" text-anchor="middle" font-size="11">artifacts/ (app bundle) + data/</text>
  <text x="1120" y="295" text-anchor="middle" font-size="11">via free S3 gateway endpoint</text>

  <rect x="995" y="336" width="250" height="78" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="1120" y="359" text-anchor="middle" font-size="13" font-weight="bold">Secrets Manager</text>
  <text x="1120" y="377" text-anchor="middle" font-size="11">DB host, user, generated password</text>
  <text x="1120" y="393" text-anchor="middle" font-size="11">encrypted with KMS CMK</text>

  <rect x="995" y="436" width="250" height="64" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="1120" y="460" text-anchor="middle" font-size="13" font-weight="bold">KMS customer-managed key</text>
  <text x="1120" y="478" text-anchor="middle" font-size="11">rotation on | RDS, Secrets, S3 app</text>

  <rect x="995" y="522" width="250" height="64" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="1120" y="546" text-anchor="middle" font-size="13" font-weight="bold">IAM role (least privilege)</text>
  <text x="1120" y="564" text-anchor="middle" font-size="11">1 secret, 1 bucket, SSM core</text>

  <rect x="995" y="608" width="250" height="64" rx="8" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="1120" y="632" text-anchor="middle" font-size="13" font-weight="bold">ACM certificate</text>
  <text x="1120" y="650" text-anchor="middle" font-size="11">DNS-validated, attached to :443</text>

  <!-- arrows to services -->
  <path d="M 830 215 L 985 215 L 985 160 L 994 160" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="209" font-size="10.5" fill="#2e7d32">access logs</text>
  <path d="M 900 500 L 985 500 L 985 270 L 994 270" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M 900 520 L 965 520 L 965 375 L 994 375" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ===== CI/CD ===== -->
  <rect x="995" y="700" width="250" height="125" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1120" y="722" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">GitHub Actions CI/CD</text>
  <text x="1120" y="741" text-anchor="middle" font-size="11">validate -> plan (PR) -> apply</text>
  <text x="1120" y="757" text-anchor="middle" font-size="11">-> smoke test (https health)</text>
  <text x="1120" y="773" text-anchor="middle" font-size="11">OIDC federation: no AWS keys</text>
  <text x="1120" y="789" text-anchor="middle" font-size="11">manual approval on "production"</text>
  <text x="1120" y="808" text-anchor="middle" font-size="11">state: S3 bucket + lockfile</text>

  <text x="1120" y="690" text-anchor="middle" font-size="10.5" fill="#1565c0">Terraform provisions everything above</text>
  <line x1="1120" y1="697" x2="1120" y2="675" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)" stroke-dasharray="4 3"/>

  <!-- Legend -->
  <rect x="185" y="840" width="12" height="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="203" y="848" font-size="10.5">public</text>
  <rect x="255" y="840" width="12" height="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="273" y="848" font-size="10.5">private app</text>
  <rect x="345" y="840" width="12" height="8" fill="#fce4ec" stroke="#ad1457"/>
  <text x="363" y="848" font-size="10.5">private DB</text>
  <text x="440" y="848" font-size="10.5" fill="#546e7a">dashed arrows = HTTPS calls made with the instance IAM role (Secrets Manager, S3) and NAT egress</text>
</svg>
